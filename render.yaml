services:
  - type: web
    name: santhicrackers-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build --workspace=@repo/db && npm run build --workspace=api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://shanthicrackers.in,https://www.shanthicrackers.in,https://admin.shanthicrackers.in,https://santhicrackers.in,https://www.santhicrackers.in,https://admin.santhicrackers.in,https://santhicrackers.vercel.app,https://santhicrackers-admin.vercel.app
